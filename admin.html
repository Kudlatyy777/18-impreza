<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>Panel administratora — 18!!!</title>
<style>
:root{--bg:#0d1016;--card:#171b23;--card2:#1e2430;--line:#2d3440;--text:#fff;--muted:#aab2c0;--danger:#ff6b6b;--ok:#7ee787}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{width:min(100%,1050px);margin:auto;padding:28px 15px 60px}
h1{margin:0 0 8px;font-size:38px} .muted{color:var(--muted)}
.card{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:240px;background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:14px;padding:13px}
button{border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:13px;padding:11px 14px;font-weight:800;cursor:pointer}
button.danger{background:#32191d;border-color:#633039;color:#ffb0b0}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.meta{padding:10px} .meta small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
.status{margin-top:12px;color:var(--muted)} .ok{color:var(--ok)} .err{color:#ff9d9d}
@media(min-width:760px){.gallery{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<h1>Panel administratora</h1>
<div class="muted">Galeria 18!!! 🎉</div>

<section class="card">
  <div class="row">
    <input id="adminKey" type="password" placeholder="Klucz administratora">
    <button onclick="saveKey()">Zapamiętaj na tym urządzeniu</button>
    <button onclick="loadGallery()">Odśwież</button>
  </div>
  <div id="status" class="status">Ładowanie galerii…</div>
</section>

<section id="gallery" class="gallery"></section>
</main>

<script>
const API = "https://18-impreza-api.kubaozek.workers.dev";
const inputKey = document.getElementById('adminKey');
const statusBox = document.getElementById('status');
const gallery = document.getElementById('gallery');

let photos = [];

inputKey.value = sessionStorage.getItem('partyAdminKey') || '';

function saveKey() {
  sessionStorage.setItem('partyAdminKey', inputKey.value.trim());
  setStatus('Klucz zapisany na czas tej sesji.', 'ok');
}

async function loadGallery() {
  setStatus('Ładowanie galerii…');

  try {
    const res = await fetch(API + '/gallery', {cache:'no-store'});
    const data = await res.json();

    if (!res.ok || !data.ok) throw new Error(data.error || 'Błąd galerii.');

    photos = data.photos || [];
    render();
    setStatus(`Zdjęć: ${photos.length}`, 'ok');
  } catch (e) {
    setStatus(e.message || String(e), 'err');
  }
}

function render() {
  gallery.innerHTML = '';

  if (!photos.length) {
    gallery.innerHTML = '<div class="muted">Brak zdjęć.</div>';
    return;
  }

  photos.forEach(p => {
    const box = document.createElement('article');
    box.className = 'item';

    const img = document.createElement('img');
    img.src = p.thumbUrl;
    img.alt = 'Zdjęcie';

    const meta = document.createElement('div');
    meta.className = 'meta';

    const small = document.createElement('small');
    small.textContent = p.name;

    const btn = document.createElement('button');
    btn.className = 'danger';
    btn.textContent = 'Usuń';
    btn.onclick = () => deleteOne(p.id);

    meta.appendChild(small);
    meta.appendChild(btn);
    box.appendChild(img);
    box.appendChild(meta);
    gallery.appendChild(box);
  });
}

async function deleteOne(fileId) {
  if (!confirm('Usunąć to zdjęcie?')) return;

  const adminKey = inputKey.value.trim();
  if (!adminKey) {
    setStatus('Wpisz klucz administratora.', 'err');
    return;
  }

  try {
    setStatus('Usuwanie…');

    const res = await fetch(API + '/delete', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({adminKey,fileId})
    });

    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Nie udało się usunąć zdjęcia.');

    setStatus('Zdjęcie usunięte.', 'ok');
    await loadGallery();
  } catch (e) {
    setStatus(e.message || String(e), 'err');
  }
}

function setStatus(text, type='') {
  statusBox.className = 'status' + (type ? ' ' + type : '');
  statusBox.textContent = text;
}

loadGallery();
</script>
</body>
</html>
